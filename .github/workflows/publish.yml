name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: node build.js

      - name: Sync web files
        run: |
          mkdir -p backend/Web
          cp frontend/dist/plugin.js backend/Web/plugin.js
          cp frontend/dist/plugin.css backend/Web/plugin.css

      - name: Build backend
        run: dotnet build backend/Moonfin.Server.csproj -c Release

      - name: Read version from csproj
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' backend/Moonfin.Server.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read target ABI from csproj
        id: abi
        run: |
          ABI=$(grep 'Jellyfin.Controller' backend/Moonfin.Server.csproj | grep -oP 'Version="\K[^"]+')
          echo "abi=${ABI}.0" >> "$GITHUB_OUTPUT"

      - name: Package release ZIP
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARGET_ABI="${{ steps.abi.outputs.abi }}"
          PLUGIN_GUID="8c5d0e91-4f2a-4b6d-9e3f-1a7c8d9e0f2b"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          mkdir -p release
          cp backend/bin/Release/net8.0/Moonfin.Server.dll release/

          cat > release/meta.json <<EOF
          {
            "category": "General",
            "changelog": "Add API key auth with user impersonation for SSO users",
            "description": "Moonfin brings a modern TV-style UI to Jellyfin web.",
            "guid": "${PLUGIN_GUID}",
            "name": "Moonfin",
            "overview": "Custom UI and settings sync for Jellyfin",
            "owner": "RadicalMuffinMan",
            "targetAbi": "${TARGET_ABI}",
            "timestamp": "${TIMESTAMP}",
            "version": "${VERSION}",
            "status": "Active",
            "autoUpdate": true,
            "assemblies": ["Moonfin.Server.dll"]
          }
          EOF

          ZIP_NAME="moonfin_${VERSION}.zip"
          cd release && zip -r "../${ZIP_NAME}" . && cd ..

          CHECKSUM=$(md5sum "$ZIP_NAME" | awk '{print $1}')

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_abi=$TARGET_ABI" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: v${{ steps.package.outputs.version }}
          files: ${{ steps.package.outputs.zip_name }}
          body: |
            Moonfin plugin build with API key auth support for SSO users.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and publish manifest.json
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          TARGET_ABI="${{ steps.package.outputs.target_abi }}"
          CHECKSUM="${{ steps.package.outputs.checksum }}"
          TIMESTAMP="${{ steps.package.outputs.timestamp }}"
          REPO="${{ github.repository }}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"

          cat > manifest.json <<EOF
          [
            {
              "guid": "8c5d0e91-4f2a-4b6d-9e3f-1a7c8d9e0f2b",
              "name": "Moonfin",
              "overview": "Custom UI and settings sync for Jellyfin",
              "description": "Moonfin brings a modern TV-style UI to Jellyfin web. Features include: custom navbar, media bar with featured content, Jellyseerr integration, and cross-device settings synchronization.",
              "owner": "RadicalMuffinMan",
              "category": "General",
              "versions": [
                {
                  "version": "${VERSION}",
                  "changelog": "Add API key auth with user impersonation for SSO users",
                  "targetAbi": "${TARGET_ABI}",
                  "sourceUrl": "https://github.com/${REPO}/releases/download/v${VERSION}/${ZIP_NAME}",
                  "checksum": "${CHECKSUM}",
                  "timestamp": "${TIMESTAMP}"
                }
              ]
            }
          ]
          EOF

      - name: Publish manifest to manifest branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan manifest-release 2>/dev/null || git checkout manifest-release
          git rm -rf . 2>/dev/null || true
          mv manifest.json .
          git add manifest.json
          git commit -m "Update manifest.json for v${{ steps.package.outputs.version }}"
          git push -f origin manifest-release
